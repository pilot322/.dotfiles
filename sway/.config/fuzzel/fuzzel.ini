[main]
font=monospace:size=12
prompt="Apps > "
icon-theme=Oranchelo
icons-enabled=yes
fields=filename,name,generic,exec,keywords,comment
filter-desktop=no
fuzzy=no
terminal=wezterm start --
lines=15
width=40
horizontal-pad=20
vertical-pad=8
inner-pad=8

# Gruvbox Dark, matching the previous Rofi theme.
[colors]
background=282828f2
text=ebdbb2ff
match=fe8019ff
selection=504945ff
selection-text=fbf1c7ff
selection-match=fe8019ff
border=d65d0eff

[border]
width=2
radius=0

[dmenu]
mode=text
exit-immediately-if-empty=yes
